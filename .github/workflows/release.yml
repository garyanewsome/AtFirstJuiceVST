name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE checkout / build deps
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: ${{ runner.os }}-juce-8.0.4-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure (universal x86_64 + arm64)
        # Force Unix Makefiles: without an explicit generator, CMake on this
        # runner picks a multi-config generator (Xcode), which nests output
        # under an extra build/AtFirstJuice_artefacts/Release/ folder.
        # Forcing this single-config generator keeps the artefact layout
        # matching local dev builds, which the paths below (and Package)
        # assume.
        run: cmake -S . -B build -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j"$(sysctl -n hw.ncpu)"

      - name: Verify universal binaries
        run: |
          set -e
          for f in \
            build/AtFirstJuice_artefacts/VST3/AtFirstJuice.vst3/Contents/MacOS/AtFirstJuice \
            build/AtFirstJuice_artefacts/AU/AtFirstJuice.component/Contents/MacOS/AtFirstJuice \
            build/AtFirstJuice_artefacts/Standalone/AtFirstJuice.app/Contents/MacOS/AtFirstJuice; do
            echo "== $f =="
            lipo -info "$f" | grep -q "x86_64 arm64" || { echo "not universal: $f"; exit 1; }
          done

      - name: Package
        run: |
          cd build/AtFirstJuice_artefacts
          zip -r "${GITHUB_WORKSPACE}/AtFirstJuice-macOS-universal.zip" VST3 AU Standalone

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: AtFirstJuice-macOS-universal.zip
          generate_release_notes: true
